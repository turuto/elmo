<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffdf5">
<title>Asignaturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1e1b4b; --ink-soft:#4c4a7a;
    --font-title:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;padding:36px 20px 28px;background:#fffdf5;color:var(--ink);font-family:var(--font-body)}
  main{max-width:1000px;margin:0 auto}
  header{text-align:center;margin:0 auto 30px}
  .logo{width:72px;height:72px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;background:#facc15;font-size:38px;transform:rotate(-5deg)}
  h1,h2,p{margin-top:0}
  h1{font-family:var(--font-title);font-size:clamp(34px,6vw,48px);line-height:1.1;margin-bottom:8px}
  header p{font-size:18px;font-weight:700;color:var(--ink-soft);margin-bottom:0}
  .asignaturas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .asignatura{--color:#eab308;--tinta:#713f12;min-height:174px;width:100%;display:flex;align-items:flex-start;gap:16px;padding:22px;border:2px solid color-mix(in srgb,var(--color) 28%,#fff);border-top:7px solid var(--color);border-radius:20px;background:#fff;color:var(--ink);font:inherit;text-align:left;text-decoration:none}
  a.asignatura{transition:transform .16s,box-shadow .16s}
  a.asignatura:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(30,27,75,.12)}
  a.asignatura:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .asignatura:disabled{background:#f8fafc;border-color:#e2e8f0;border-top-color:color-mix(in srgb,var(--color) 45%,#94a3b8);color:#475569;cursor:not-allowed}
  .asignatura:disabled .icono{background:#e2e8f0;filter:grayscale(1)}
  .asignatura:disabled .estado{color:#475569}
  .icono{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:15px;background:color-mix(in srgb,var(--color) 13%,#fff);font-size:29px}
  .contenido{display:flex;flex-direction:column;gap:5px;min-width:0}
  .contenido strong{font-family:var(--font-title);font-size:23px;line-height:1.15}
  .estado{font-size:14px;font-weight:800;color:var(--tinta)}
  .a-social{--color:#dc2626;--tinta:#991b1b}
  .a-naturales{--color:#16a34a;--tinta:#166534}
  .a-galega{--color:#7c3aed;--tinta:#5b21b6}
  .a-ingles{--color:#ea580c;--tinta:#9a3412}
  .a-mates{--color:#2563eb;--tinta:#1e40af}
  .a-lengua{--color:#eab308;--tinta:#713f12}
  footer{text-align:center;margin-top:24px;color:var(--ink-soft);font-weight:700}
  @media(max-width:700px){body{padding:28px 16px 24px}.asignaturas{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.asignatura{min-height:150px;padding:18px 14px;gap:12px}.icono{width:44px;height:44px;font-size:25px}.contenido strong{font-size:20px}}
  @media(max-width:440px){.asignaturas{grid-template-columns:1fr}.asignatura{min-height:0;align-items:center}}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">📚</div>
    <h1>¿Qué asignatura elegimos?</h1>
    <p>Elige qué quieres estudiar hoy</p>
  </header>

  <section class="asignaturas" aria-label="Asignaturas">
    <button class="asignatura a-social" type="button" disabled>
      <span class="icono" aria-hidden="true">🌍</span>
      <span class="contenido"><strong>Social</strong><span class="estado">Próximamente</span></span>
    </button>
    <button class="asignatura a-naturales" type="button" disabled>
      <span class="icono" aria-hidden="true">🌿</span>
      <span class="contenido"><strong>Naturales</strong><span class="estado">Próximamente</span></span>
    </button>
    <button class="asignatura a-galega" type="button" disabled>
      <span class="icono" aria-hidden="true">📖</span>
      <span class="contenido"><strong>Lingua Galega</strong><span class="estado">Próximamente</span></span>
    </button>
    <button class="asignatura a-ingles" type="button" disabled>
      <span class="icono" aria-hidden="true">💬</span>
      <span class="contenido"><strong>Inglés</strong><span class="estado">Próximamente</span></span>
    </button>
    <button class="asignatura a-mates" type="button" disabled>
      <span class="icono" aria-hidden="true">🔢</span>
      <span class="contenido"><strong>Matemáticas</strong><span class="estado">Próximamente</span></span>
    </button>
    <a class="asignatura a-lengua" href="lengua/index.html">
      <span class="icono" aria-hidden="true">✏️</span>
      <span class="contenido"><strong>Lengua</strong><span class="estado">Ver ejercicios →</span></span>
    </a>
  </section>

  <footer>Por ahora, solo Lengua está disponible.</footer>
</main>
</body>
</html>
